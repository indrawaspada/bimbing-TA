name: BimbingTA hosted validation
run-name: BimbingTA DEV - ${{ inputs.run_native_ledger_tests && 'isolated native ledger and audit' || inputs.run_restore_sql_rehearsal && 'restore SQL rollback and audit' || inputs.apply_rubric_guard_repair && 'rubric guard repair and audit' || inputs.run_persona_tests && 'persona tests' || 'read-only audit' }}

on:
  workflow_dispatch:
    inputs:
      run_persona_tests:
        description: 'Authorize synthetic DEV users/PDFs and temporary app email allowance; restore Google-only and clean this run'
        type: boolean
        required: true
        default: false
      confirm_ref:
        description: 'Supabase DEV project ref (full tests require an exact match)'
        type: string
        required: true
        default: tghcovjdsxirhpexpqor
      apply_rubric_guard_repair:
        description: 'D branch only: apply additive 00010 rubric/prompt guard repair after read-only audit; no reseed or user-data updates'
        type: boolean
        required: false
        default: false
      run_restore_sql_rehearsal:
        description: 'D only: synthetic restore SQL in DEV transaction, reuse existing owner; always rollback; no API/provider calls'
        type: boolean
        required: false
        default: false
      run_native_ledger_tests:
        description: 'D only: native PG17 ledger concurrency in disposable localhost database; no Supabase secrets/provider calls'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: bimbingta-hosted-dev-tghcovjdsxirhpexpqor
  cancel-in-progress: false

jobs:
  isolated_native_ledger:
    if: github.repository == 'indrawaspada/bimbing-TA' && github.ref == 'refs/heads/codex/checkpoint-d' && inputs.run_native_ledger_tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: bimbingta_ledger_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact dispatched D source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        timeout-minutes: 8
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Native ledger with observed multi-connection lock waits
        timeout-minutes: 3
        env:
          BT_NATIVE_LEDGER_DB_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/bimbingta_ledger_test
        run: yarn test:ledger:native
  checkpoint_d_audit:
    if: github.repository == 'indrawaspada/bimbing-TA' && github.ref == 'refs/heads/codex/checkpoint-d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Refuse legacy personas and require exact DEV confirmation
        env:
          PERSONAS: ${{ inputs.run_persona_tests }}
          CONFIRM_REF: ${{ inputs.confirm_ref }}
        run: |
          test "$PERSONAS" = 'false'
          test "$CONFIRM_REF" = 'tghcovjdsxirhpexpqor'
      - name: Checkout exact dispatched checkpoint D source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        timeout-minutes: 8
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Typecheck, build and local audit safety tests
        run: |
          yarn build
          yarn typecheck:edge
          node --test --test-concurrency=1 tests/hosted-audit/*.test.mjs
          node --test --test-concurrency=1 tests/restore/hosted-rollback.test.mjs
      - name: Audit before explicitly selected rubric guard repair
        if: inputs.apply_rubric_guard_repair
        timeout-minutes: 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/hosted-audit.mjs --allow-pending-rubric-repair
      - name: Apply only reviewed additive rubric guard repair
        if: inputs.apply_rubric_guard_repair
        timeout-minutes: 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/hosted-migrate.mjs --apply --confirm-ref=tghcovjdsxirhpexpqor --only=20261009000010
      - name: Read-only audit of existing DEV data
        timeout-minutes: 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/hosted-audit.mjs
      - name: Synthetic restore SQL rehearsal with verified rollback
        if: inputs.run_restore_sql_rehearsal
        timeout-minutes: 4
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/hosted-restore-rehearsal.mjs --confirm-ref=tghcovjdsxirhpexpqor --use-existing-owner
  validate:
    if: github.repository == 'indrawaspada/bimbing-TA' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout reviewed checkpoint C source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: bfdfd479d1c4d75b088833ada56c21e748b12258
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        id: install
        timeout-minutes: 8
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Typecheck and frontend build (public config only)
        run: yarn build
      - name: Apply reviewed conflict HTTP 409 repair on empty DEV
        id: repair
        if: inputs.run_persona_tests
        timeout-minutes: 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BT_HOSTED_CONFIRM_REF: ${{ inputs.confirm_ref }}
        run: node scripts/hosted-ci.mjs repair-conflict-code
      - name: Read-only hosted preflight
        id: preflight
        timeout-minutes: 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/hosted-ci.mjs preflight
      - name: Persona Auth / Database / Storage / C
        id: personas
        if: inputs.run_persona_tests
        timeout-minutes: 6
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BT_HOSTED_CONFIRM_REF: ${{ inputs.confirm_ref }}
        run: yarn test:hosted
      - name: Recover current run and restore policy
        id: recovery
        if: ${{ always() && inputs.run_persona_tests && steps.install.outcome == 'success' }}
        timeout-minutes: 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/hosted-ci.mjs cleanup
      - name: Verify empty DEV after persona cleanup (read-only)
        id: postcheck
        if: ${{ always() && inputs.run_persona_tests && steps.preflight.outcome == 'success' && steps.recovery.outcome == 'success' }}
        timeout-minutes: 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/hosted-ci.mjs preflight
      - name: Safe result summary
        if: always()
        env:
          REPAIR_RESULT: ${{ steps.repair.outcome }}
          POSTCHECK_RESULT: ${{ steps.postcheck.outcome }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          PERSONA_RESULT: ${{ steps.personas.outcome }}
          RECOVERY_RESULT: ${{ steps.recovery.outcome }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const lines = [
            '# BimbingTA DEV validation',
            '',
            'Reviewed source: `bfdfd479d1c4d75b088833ada56c21e748b12258`',
            '',
            `Reviewed conflict repair: ${process.env.REPAIR_RESULT}`,
            `Cleanup read-only verification: ${process.env.POSTCHECK_RESULT}`,
            `Read-only preflight: ${process.env.PREFLIGHT_RESULT}`,
            `Persona suite: ${process.env.PERSONA_RESULT}`,
            `Recovery: ${process.env.RECOVERY_RESULT}`,
            '',
            'Preflight success does not prove persona tests or real Google OAuth.',
            'Full mode applies only reviewed migration 20261007000008 on empty DEV. No reset, deployment or AI calls.',
            ''
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          JS
